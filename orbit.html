<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <style>
      html,
      body {
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }
      body {
        min-width: 100vw;
        min-height: 100vh;
        width: auto;
        height: auto;
        overflow: auto;
        margin: 0;
        padding: 0;
        background: #000;
      }
      figure {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        overflow: hidden;
      }
      figure img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <figure>
      <img src="./page/orbit.png" alt="" />
    </figure>
  </body>
</html>
